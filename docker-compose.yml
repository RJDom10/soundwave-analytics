#version: "3.9"

networks:
  soundwave-net:
    driver: bridge

volumes:
  mysql_data:
  kafka_data:
  airflow_logs:
  hadoop_namenode:    
  hadoop_datanode:   

services:

  # ── MySQL ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sw_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/warehouse/ddl:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    command: >
      --log-bin=mysql-bin
      --binlog-format=ROW
      --server-id=1
    networks:
      - soundwave-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (requerido por Kafka) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sw_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - soundwave-net

  # ── Kafka ────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sw_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - soundwave-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Kafka UI ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sw_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: soundwave-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - soundwave-net

  # ── Jupyter Lab ──────────────────────────────────────────
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: sw_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "soundwave"
    networks:
      - soundwave-net

# ── Hadoop Namenode ─────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: sw_namenode
    ports:
      - "9870:9870"   # HDFS Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      CLUSTER_NAME: soundwave
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    networks:
      - soundwave-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Hadoop Datanode ──────────────────────────────────────
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: sw_datanode
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    networks:
      - soundwave-net

# ── Spark Master ─────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: sw_spark_master
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"    # Spark master RPC
      - "8090:8080"    # Spark master Web UI
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    volumes:
      - ./services/streaming/jobs:/app/jobs
    networks:
      - soundwave-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Spark Worker ─────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    container_name: sw_spark_worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: "8081"
    networks:
      - soundwave-net  


  # ── Productor de LastFM ──────────────────────────────────
  lastfm-producer:
    build: ./services/ingesta/producers
    container_name: sw_lastfm_producer
    command: ["lastfm_producer.py"] # <── Dockerfile ejecuta esto usando el ENTRYPOINT
    restart: "no"
    profiles: ["ingesta-manual"]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env # <── Senior: Centraliza las credenciales en su archivo .env dedicado
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092 # <── Red interna de Docker
    networks:
      - soundwave-net

  # ── Simulador de Eventos (Si quieres prenderlo también) ──
  event-simulator:
    build: ./services/ingesta/producers
    container_name: sw_event_simulator
    command: ["event_simulator.py"] # <── Reutiliza la misma imagen de Docker pero corre otro script
    restart: "no"
    profiles: ["ingesta-manual"]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env 
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - soundwave-net